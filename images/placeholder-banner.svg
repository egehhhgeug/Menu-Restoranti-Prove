<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d2b1f"/>
      <stop offset="1" stop-color="#1c1410"/>
    </linearGradient>
    <pattern id="tex" width="18" height="18" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#f4e9da" stroke-opacity="0.05" stroke-width="9"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#tex)"/>
  <rect x="2" y="2" width="1596" height="896" fill="none" stroke="#cd212a" stroke-opacity="0.55" stroke-width="4"/>
  <text x="50%" y="46%" text-anchor="middle" font-family="Georgia, serif" font-size="46" fill="#f4e9da" opacity="0.9">Restaurant photo goes here</text>
  <text x="50%" y="54%" text-anchor="middle" font-family="monospace" font-size="20" fill="#f4e9da" opacity="0.6">replace images/placeholder-banner.jpg</text>
